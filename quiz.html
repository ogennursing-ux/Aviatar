<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>משחק שאלות</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            color: #667eea;
            margin-bottom: 30px;
            text-align: center;
            font-size: 28px;
        }

        .question-container {
            margin-bottom: 30px;
        }

        .question {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
        }

        .progress {
            background: #eee;
            height: 8px;
            border-radius: 10px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            transition: width 0.3s ease;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option {
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: white;
            font-size: 16px;
        }

        .option:hover {
            border-color: #667eea;
            background: #f5f5ff;
        }

        .option.selected {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .option.correct {
            background: #4caf50;
            color: white;
            border-color: #4caf50;
        }

        .option.wrong {
            background: #f44336;
            color: white;
            border-color: #f44336;
        }

        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s ease;
            margin-top: 20px;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .results {
            text-align: center;
            display: none;
        }

        .score {
            font-size: 48px;
            color: #667eea;
            margin: 20px 0;
            font-weight: bold;
        }

        .results h2 {
            color: #333;
            margin-bottom: 20px;
        }

        .counter {
            color: #999;
            font-size: 14px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 משחק שאלות</h1>

        <div id="quiz">
            <div class="progress">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div class="counter">שאלה <span id="currentQuestion">1</span> מתוך <span id="totalQuestions">5</span></div>

            <div class="question-container">
                <div class="question" id="question"></div>
                <div class="options" id="options"></div>
            </div>

            <button id="nextBtn" onclick="nextQuestion()" disabled>הבא →</button>
        </div>

        <div class="results" id="results">
            <h2>סיום המשחק! 🎉</h2>
            <div class="score" id="finalScore"></div>
            <p>נקודות מתוך 100</p>
            <button onclick="location.reload()">משחק חדש ↻</button>
        </div>
    </div>

    <script>
        const questions = [
            {
                question: "מה הוא הכוכב בקרוב ביותר לכדור הארץ?",
                options: ["סיריוס", "פרוקסימה קנטאורי", "אלפא קנטאורי", "ווגה"],
                correct: 1
            },
            {
                question: "איזו מדינה היא בעלת הגבול הארוך ביותר?",
                options: ["רוסיה", "קנדה", "ארצות הברית", "אוסטרליה"],
                correct: 1
            },
            {
                question: "כמה צלעות יש לקוביה?",
                options: ["6", "8", "12", "20"],
                correct: 2
            },
            {
                question: "מי כתב את 'רומיאו וג'וליט'?",
                options: ["ג'יין אוסטן", "ויליאם שכספיר", "תומס הרדי", "ג'ורג' אורוול"],
                correct: 1
            },
            {
                question: "מה היא בירת צרפת?",
                options: ["ליון", "מרסיי", "פריז", "נים"],
                correct: 2
            }
        ];

        let currentQ = 0;
        let score = 0;
        let answered = false;

        function loadQuestion() {
            const q = questions[currentQ];
            document.getElementById('question').textContent = q.question;
            document.getElementById('currentQuestion').textContent = currentQ + 1;
            document.getElementById('totalQuestions').textContent = questions.length;

            const progress = ((currentQ + 1) / questions.length) * 100;
            document.getElementById('progressBar').style.width = progress + '%';

            const optionsDiv = document.getElementById('options');
            optionsDiv.innerHTML = '';

            q.options.forEach((opt, i) => {
                const btn = document.createElement('div');
                btn.className = 'option';
                btn.textContent = opt;
                btn.onclick = () => selectOption(i);
                optionsDiv.appendChild(btn);
            });

            answered = false;
            document.getElementById('nextBtn').disabled = true;
        }

        function selectOption(idx) {
            if (answered) return;

            const q = questions[currentQ];
            const options = document.querySelectorAll('.option');

            options.forEach((opt, i) => {
                if (i === q.correct) opt.classList.add('correct');
                else if (i === idx && i !== q.correct) opt.classList.add('wrong');
            });

            if (idx === q.correct) score += 20;

            answered = true;
            document.getElementById('nextBtn').disabled = false;
        }

        function nextQuestion() {
            currentQ++;
            if (currentQ < questions.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            document.getElementById('quiz').style.display = 'none';
            document.getElementById('results').style.display = 'block';
            document.getElementById('finalScore').textContent = score;
        }

        loadQuestion();
    </script>
</body>
</html>
